; NEXORA — DefaultInput.ini (UE 5.8, Enhanced Input)
; UNCOMPILED SCAFFOLD — written to UE 5.8 API conventions in a Linux VM without the engine;
; first compile happens on the owner's PC (Phase 1/3).
;
; NEXORA uses Enhanced Input ONLY (master plan Phase 3). There is no legacy axis/action
; mapping in this file. The Input Mapping Context and Input Actions below are ASSETS
; created in the editor during Phase 3 at the paths listed; this file records the
; contract so the C++ in Source/Nexora matches the editor setup exactly.
;
; Action table — mirrors the Godot testbed controls (rupsha-city/project.godot),
; so the Phase 3 controller feels identical to the verified prototype:
;
;   IA_Move (Vector2D)      W/A/S/D + left stick       -> PlayerController Move
;   IA_Look (Vector2D)      Mouse + right stick        -> spring-arm camera (wall collision)
;   IA_Run (bool)           Shift / left stick click   -> sprint (Godot: run, Shift)
;   IA_Jump (bool)          Space / A button           -> jump (Godot: jump, Space)
;   IA_Interact (bool)      F / X button               -> doors, sit, enter vehicle (Phase 3)
;   IA_Pause (bool)         Esc / Start                -> pause menu
;   IA_TimeSkip (bool)      T                          -> sleep / time-skip prompt (Phase 7)
;
; Asset paths (create in Phase 3):
;   /Game/Nexora/Input/IMC_Nexora.IMC_Nexora
;   /Game/Nexora/Input/IA_Move.IA_Move  (etc. — one IA_* asset per row above)

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
bEnableWorldSubsystem=False
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
; The IMC is added at runtime by NexoraPlayerController::BeginPlay (see Source/Nexora).
; No legacy [/Script/Engine.InputSettings] ActionMappings/AxisMappings are used.
