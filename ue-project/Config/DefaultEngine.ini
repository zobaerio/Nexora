; NEXORA — DefaultEngine.ini (UE 5.8)
; UNCOMPILED SCAFFOLD — written to UE 5.8 API conventions in a Linux VM without the engine;
; first compile happens on the owner's PC (Phase 1/3). See docs/PHASE1-BUILD-SHEET.md Step 5.
; Only Phase 1–2 plugins are enabled here (MetaHuman, PCG, Water, Niagara, Enhanced Input).
; Mass/State Tree/Chaos Vehicles are enabled at their phases — never early (build sheet Step 6).

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Nexora/Environment/Phase1/L_Phase1_Environment.L_Phase1_Environment
GameDefaultMap=/Game/Nexora/Environment/Phase1/L_Phase1_Environment.L_Phase1_Environment
GlobalDefaultGameMode=/Script/Nexora.NexoraGameMode
GlobalDefaultServerGameMode=/Script/Nexora.NexoraGameMode

[/Script/Engine.RendererSettings]
r.DefaultFeature.AntiAliasing=2
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.Bloom=True
r.AllowStaticLighting=False
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionCaptureResolution=256
; Lumen is the Phase 1 lighting target (master plan Part B.1). If the owner's GPU
; struggles in the Phase 1 perf capture, fall back per the build sheet's scalability table.

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.0
bEnableEnhancedDeterminism=False

[/Script/Engine.WorldSettings]
bEnableWorldPartition=False
; Phase 1 is a single 400 m x 400 m level (no streaming). World Partition arrives with
; District 1 scale in Phase 5 — do not enable it here.

[/Script/Engine.Engine]
+ActiveClassRedirects=(OldClassName="NexoraGameModeBase",NewClassName="/Script/Nexora.NexoraGameMode")
